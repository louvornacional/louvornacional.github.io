<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100dvh;background:#0a0a0a;color:#f3efe6;font-family:Sora,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 22px;text-align:center;
background-image:radial-gradient(40% 35% at 80% 10%,rgba(227,176,75,.16),transparent 70%)}
img{width:84px;height:auto;margin-bottom:22px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(34px,6vw,56px);line-height:1}
p.k{margin-top:12px;font-size:11px;letter-spacing:.3em;color:#e3b04b;font-weight:600}
ul{list-style:none;margin-top:40px;width:100%;max-width:460px;display:grid;gap:10px}
a{display:flex;justify-content:space-between;align-items:center;gap:12px;text-decoration:none;color:#f3efe6;background:linear-gradient(180deg,rgba(30,30,30,.8),rgba(20,20,20,.8));border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px 20px;text-align:left;transition:border-color .3s}
a:hover{border-color:rgba(227,176,75,.5)}
a b{display:block;font-size:15px}a small{display:block;color:#9a9a9a;font-size:12.5px;margin-top:4px}a span{color:#e3b04b;font-size:20px}
@media(min-width:900px){img{width:110px}h1{font-size:68px}p.k{font-size:12.5px;margin-top:16px}ul{max-width:560px;margin-top:52px}a{padding:24px 26px;border-radius:18px}a b{font-size:18px}a small{font-size:14px}a span{font-size:24px}}
